</style></head><body><div class="shell"><div class="top"><a class="brand-back" href="index.html#games" title="Terug naar Kickza Games"><img src="assets/kickza-board-mark.svg" alt="Kickza logo"><b>Kickza FC</b><small>‹ Alle spellen</small></a><div class="wallet"><div class="pill">🪙 <span id="money">—</span></div><div class="pill">⚡ <span id="energy">—</span></div><div class="pill">🎲 <span id="diceCount">—</span></div></div></div><div class="hero"><a class="hero-link" href="index.html#games" aria-label="Terug naar alle Kickza spellen"><div class="eyebrow">KICKZA</div><h1>CLUB <span>TYCOON</span> ⚑</h1></a><div id="roundText" class="notice">Een voetbalbordspel in het stadion</div></div><div class="layout"><div><div class="stadium-stage"><div class="field-wrap"><div class="stadium"><div class="board" id="board"></div></div></div></div><div class="actions" id="actions"></div><div class="status" id="status"></div></div><div><div class="panel"><b>🏆 Clubranglijst</b><div id="players" class="players" style="margin-top:10px"></div></div><div class="panel" style="margin-top:12px"><b>📋 Contracten</b><div id="contracts"></div></div><div class="panel" style="margin-top:12px"><b>🗞️ Wedstrijdverslag</b><div id="log"></div></div><div class="actions"><button class="secondary" onclick="newGame()">Nieuw spel</button><button class="secondary" onclick="location.href='index.html'">‹ Kickza Games</button><button class="secondary" onclick="location.href='index.html#passport'">Voetbalpaspoort</button><button class="secondary" onclick="location.href='index.html#ttt'">Tiki-Taka-Toe</button><button class="secondary" onclick="location.href='index.html#top10'">Top 10</button></div></div></div></div><div id="overlay" class="modal hidden"></div><script>
const roster=[
['Vinícius Júnior',140,'⚽'],['Jude Bellingham',160,'⚽'],['Pedri',180,'⚽'],['Kylian Mbappé',200,'⚽'],['Erling Haaland',220,'⚽'],['Lamine Yamal',240,'⚽'],['Florian Wirtz',260,'⚽'],['Bukayo Saka',280,'⚽'],['Phil Foden',300,'⚽'],['Virgil van Dijk',320,'🛡️'],['Kevin De Bruyne',340,'⚽'],['Lionel Messi',360,'⚽'],['Cristiano Ronaldo',380,'⚽'],['Pep Guardiola',400,'👔'],['Jürgen Klopp',420,'👔'],['Carlo Ancelotti',440,'👔'],['Thibaut Courtois',460,'🧤'],['Alisson Becker',480,'🧤'],['João Neves',500,'⚽'],['Vitinha',520,'⚽'],['Alexander Isak',540,'⚽'],['Rodri',560,'⚽'],['Cole Palmer',580,'⚽'],['Raphinha',600,'⚽']];
const layout=['start',0,1,'chance',2,3,'parking',4,5,'bonus',6,7,'destroy',8,9,'chance',10,11,'prison',12,13,'bonus',14,15,'sponsor'];
const colors=['#d2ff00','#f06272','#5ba8ff','#ffc453'];
const cardsChance=[['Transferklapper',250],['Blessurekosten',-170],['Nieuwe sponsordeal',320],['Contractboete',-130],['Bekerwinst',260],['Stadiononderhoud',-200],['Jeugdopleiding',160],['Geen geluk',0],['TV-rechten',280],['Vervroegde aftrap',200]];
const cardsBonus=[['Shirtverkoop',200],['Geen bonus',0],['Seizoenspremie',350],['Geen bonus',0],['Supportersactie',150],['Extra salarissen',-120],['Gouden schoen',300],['Geen bonus',0],['Clubkas',100],['Sponsorpakket',250]];
const saveKey='kickza-club-tycoon-v2';let g=null,timer=null;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Math.round(n).toLocaleString('nl-NL');
function persist(){try{localStorage.setItem(saveKey,JSON.stringify(g))}catch(e){}}
function log(m){g.log.unshift(m);g.log=g.log.slice(0,12)}
function tile(i){const type=layout[i];if(typeof type==='number'){const a=g.locked&&g.locked[i]?g.locked[i]:roster[(type+g.rotation*16)%roster.length];return {type:'asset',name:a[0],price:a[1],icon:a[2],rent:Math.round(a[1]*.22),slot:type}}return {type,name:({start:'START +200',chance:'KANS',bonus:'BONUS',parking:'VRIJ PARKEREN',destroy:'SLOOP STADION',prison:'GEVANGENIS',sponsor:'SPONSOR'})[type],icon:({start:'🏁',chance:'❔',bonus:'🎁',parking:'🅿️',destroy:'🏗️',prison:'🔒',sponsor:'💶'})[type]}}
function start(n,bot){g={solo:n===1,players:Array.from({length:n},(_,i)=>({name:bot&&i===1?'Kickza FC · CPU':'Speler '+(i+1),pos:0,cash:1500,energy:10,alive:true,jailed:0})),bot,turn:0,round:1,rotation:0,owners:Array(24).fill(-1),levels:Array(24).fill(0),locked:{},phase:'roll',dice:[],deckChance:0,deckBonus:0,log:['Welkom! Iedere club begint met 1.500 munten en 10 bliksems.'],winner:null,modal:null,demolitionUsed:[],lastDice:0};if(g.solo){g.players[0].name='Kickza FC';g.players[0].cash=1250;g.players[0].energy=50;for(const i of [5,10,16,22])g.owners[i]=-2;g.log=['Solo Club Tycoon: bouw je club, koop contracten en speel zonder tegenstanders.']}persist();render()}
function current(){return g.players[g.turn]}
function assets(i){return g.owners.filter(o=>o===i).length}
function net(i){return g.players[i].cash+g.owners.reduce((s,o,k)=>s+(o===i?tile(k).price*(1+g.levels[k]*.5):0),0)}
function roll(){if(!g||g.phase!=='roll')return;const p=current();if(p.energy<1){p.energy+=5;log(p.name+' krijgt 5 nieuwe bliksems.')}p.energy--;const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);g.dice=[a,b];g.lastDice=a+b;if(p.jailed){p.jailed=0;g.phase='end';log(p.name+' slaat een beurt over in de gevangenis.');persist();render();return}const prev=p.pos;p.pos=(p.pos+a+b)%24;if(prev+a+b>=24){p.cash+=200;log(p.name+' passeert START: +200 munten')}const t=tile(p.pos);log(p.name+' gooit '+a+' + '+b+' en landt op '+t.name);g.phase='end';if(t.type==='asset'){const owner=g.owners[p.pos];if(owner===-1)g.phase='buy';else if(owner!==g.turn){const rent=t.rent*(1+g.levels[p.pos]*2);pay(g.turn,rent,owner);g.modal={title:'Contractvergoeding',desc:p.name+' betaalt '+money(rent)+' munten aan '+(owner===-2?'een rivaliserende club':g.players[owner].name)+' voor '+t.name+'.',icon:'💸'};g.phase='modal'}}else if(t.type==='chance'||t.type==='bonus')draw(t.type);else if(t.type==='destroy'){if(g.solo){const reward=125+Math.floor(Math.random()*175);p.cash+=reward;p.energy+=5;g.modal={title:'Rivaliserend stadion gesloopt!',desc:'+'+money(reward)+' munten en +5 bliksems',icon:'🏗️'};g.phase='modal';log('Sloop stadion: +'+reward+' munten en +5 bliksems')}else{g.phase='destroy';g.modal={title:'Sloop stadion',desc:'Kies een tegenstander. Een geslaagde sloop levert geld en bliksems op.',icon:'🏗️'}}}else if(t.type==='sponsor'){p.cash+=150;log('Sponsorbonus: +150 munten')}else if(t.type==='prison'){p.jailed=1;log(p.name+' moet de volgende beurt overslaan.')}persist();render()}
function pay(from,amount,to){const p=g.players[from],paid=Math.min(p.cash,amount);p.cash-=amount;if(to>=0)g.players[to].cash+=paid;if(p.cash<=0){p.alive=false;for(let i=0;i<24;i++)if(g.owners[i]===from){g.owners[i]=-1;g.levels[i]=0;if(g.locked)delete g.locked[i]}log(p.name+' is failliet!')}}
function buy(){if(g.phase!=='buy')return;const p=current(),t=tile(p.pos);if(p.cash<t.price)return;p.cash-=t.price;g.locked=g.locked||{};g.locked[p.pos]=roster[(t.slot+g.rotation*16)%roster.length];g.owners[p.pos]=g.turn;g.phase='end';log(p.name+' koopt '+t.name+' voor '+money(t.price));persist();render()}
function skip(){if(g.phase!=='buy')return;g.phase='end';log('Contract niet gekocht.');persist();render()}
function upgrade(i){if(g.phase!=='end'||g.owners[i]!==g.turn||g.levels[i]>=3)return;const cost=Math.round(tile(i).price*.65)*(g.levels[i]+1);if(current().cash<cost)return;current().cash-=cost;g.levels[i]++;log(tile(i).name+' geüpgraded naar niveau '+g.levels[i]);persist();render()}
function draw(kind){const chance=kind==='chance',deck=chance?cardsChance:cardsBonus,key=chance?'deckChance':'deckBonus',c=deck[g[key]++%deck.length],p=current();if(c[1]<0)pay(g.turn,-c[1],-1);else p.cash+=c[1];g.phase='modal';g.modal={title:(chance?'Kanskaart: ':'Bonuskaart: ')+c[0],desc:(c[1]>0?'+':'')+money(c[1])+' Kickza-munten',icon:chance?'❔':'🎁'};log(g.modal.title+' '+g.modal.desc)}
function closeModal(){g.modal=null;g.phase='end';persist();render()}
function demolish(target){if(g.phase!=='destroy')return;const p=current(),enemy=g.players[target];if(target===g.turn||!enemy.alive)return;const amount=Math.min(enemy.cash,100+assets(target)*35);pay(target,amount,g.turn);p.energy+=3;log(p.name+' sloopt een tribune van '+enemy.name+': +'+money(amount)+' munten en +3 ⚡');g.modal={title:'Stadion gesloopt!',desc:'+'+money(amount)+' munten en +3 bliksems',icon:'🏗️'};g.phase='modal';persist();render()}
function finish(){g.winner=g.players.map((p,i)=>({i,value:p.alive?net(i):-1})).sort((a,b)=>b.value-a.value)[0].i;g.phase='finished';log(g.players[g.winner].name+' wint het seizoen!');persist();render()}
function next(){if(g.phase!=='end')return;if(g.solo){g.round++;if((g.round-1)%5===0){g.rotation++;log('Nieuwe transfermarkt! Vrije spelers vernieuwd.')}if(g.round>40){g.round=1;g.rotation++;current().cash+=500;current().energy+=25;log('Nieuw seizoen! +500 munten en +25 bliksems.')}g.phase='roll';g.dice=[];persist();render();return}const alive=g.players.filter(p=>p.alive);if(alive.length===1){finish();return}const old=g.turn;do{g.turn=(g.turn+1)%g.players.length}while(!g.players[g.turn].alive);if(g.turn<=old){g.round++;if((g.round-1)%5===0){g.rotation++;for(let i=0;i<24;i++)if(typeof layout[i]==='number'&&g.owners[i]===-1){g.levels[i]=0;if(g.locked)delete g.locked[i]};log('TRANSFERMARKT VERNIEUWD! Vrije spelers zijn vervangen.')}if(g.round>40){finish();return}}g.phase='roll';g.dice=[];persist();render()}
function newGame(){if(!confirm('Wil je een nieuw spel starten?'))return;g=null;localStorage.removeItem(saveKey);render()}
function boardTile(i){const t=tile(i),own=g.owners[i],p=g.players.map((pl,j)=>pl.alive&&pl.pos===i?['🟢','🔴','🔵','🟡'][j]:'').join('');return '<div class="tile '+t.type+(own>=0?' owned':'')+(g.players.some(pl=>pl.alive&&pl.pos===i)?' here':'')+'" style="--owner:'+(own>=0?colors[own]:'#ddd')+'"><div class="face">'+t.icon+'</div><div class="nm">'+esc(t.name)+'</div>'+(t.price?'<div class="price">🪙 '+money(t.price)+'</div>':'')+'<div class="tokens">'+p+'</div></div>'}
function drawBoard(){let out='';for(let r=0;r<7;r++)for(let c=0;c<7;c++){if(r>0&&r<6&&c>0&&c<6){if(r===1&&c===1)out+='<div class="pitch"><img src="assets/kickza-board-mark.svg" alt="Kickza K"><span class="stadium-label">⚽ CLUB TYCOON</span><div class="cards"><div class="mini-card">❔ KANS</div><div class="mini-card">🎁 BONUS</div></div></div>';continue}let i;if(r===6)i=c;else if(c===6)i=6+(6-r);else if(r===0)i=12+(6-c);else i=18+r;out+=boardTile(i)}return out}
function botStep(){if(!g||!g.bot||g.turn!==1||g.phase==='finished')return;if(g.phase==='roll')roll();else if(g.phase==='buy'){if(current().cash>tile(current().pos).price+200)buy();else skip()}else if(g.phase==='modal')closeModal();else if(g.phase==='destroy')demolish(0);else if(g.phase==='end'){const i=g.owners.findIndex((o,k)=>o===1&&g.levels[k]<3&&current().cash>tile(k).price*1.2);if(i>=0)upgrade(i);next()}}
function render(){const board=document.getElementById('board');if(!g){board.innerHTML='<div class="pitch" style="grid-column:1/8;grid-row:1/8"><img src="assets/kickza-board-mark.svg" alt="Kickza"><b>CLUB TYCOON</b></div>';document.getElementById('actions').innerHTML='<button class="action" onclick="start(1,false)">⚽ SOLO SPELEN</button><button class="secondary" onclick="start(2,true)">🎮 Tegen computer</button><button class="secondary" onclick="start(2,false)">2 vrienden</button><button class="secondary" onclick="start(3,false)">3 vrienden</button><button class="secondary" onclick="start(4,false)">4 vrienden</button>';document.getElementById('status').textContent='Speel alleen zoals een solo bordspel, tegen de computer of samen op één apparaat.';document.getElementById('roundText').textContent='40 rondes · contracten · kanskaarten · stadion slopen';document.getElementById('players').innerHTML='';document.getElementById('contracts').innerHTML='<p class="notice">Koop spelers en trainers, verbeter contracten en laat tegenstanders betalen.</p>';document.getElementById('log').innerHTML='';document.getElementById('overlay').classList.add('hidden');return}const p=current();board.innerHTML=drawBoard();document.getElementById('money').textContent=money(p.cash);document.getElementById('energy').textContent=p.energy;document.getElementById('diceCount').textContent=g.dice.length?g.dice.join('+'):'—';document.getElementById('roundText').textContent='Ronde '+Math.min(g.round,40)+'/40 · Nieuwe vrije spelers over '+(5-(g.round-1)%5)+' rondes';document.getElementById('players').innerHTML=g.players.map((pl,i)=>'<div class="player '+(g.turn===i?'active':'')+'" style="opacity:'+(pl.alive?1:.5)+'"><div class="name">'+['🟢','🔴','🔵','🟡'][i]+' '+esc(pl.name)+'</div><div class="stats">🪙 '+money(pl.cash)+' · ⚡ '+pl.energy+'<br>Clubwaarde '+money(net(i))+'<br>'+assets(i)+' contracten</div></div>').join('');document.getElementById('contracts').innerHTML=g.owners.map((o,i)=>o===g.turn?'<div class="row"><span>'+esc(tile(i).name)+' · lvl '+g.levels[i]+'</span><button class="secondary" '+(g.phase!=='end'||g.levels[i]>=3||p.cash<Math.round(tile(i).price*.65)*(g.levels[i]+1)?'disabled':'')+' onclick="upgrade('+i+')">Upgrade</button></div>':'').join('')||'<p class="notice">Nog geen contracten gekocht.</p>';document.getElementById('log').innerHTML=g.log.slice(0,8).map(x=>'<div class="row">'+esc(x)+'</div>').join('');const actions=document.getElementById('actions');if(g.phase==='roll')actions.innerHTML='<button class="action" onclick="roll()"><span class="dice-pair"><i class="die3d">⚀</i><i class="die3d">⚄</i></span><br>GOOI<br><small style="font-size:13px">⚡ 1</small></button>';else if(g.phase==='buy'){const t=tile(p.pos);actions.innerHTML='<button class="action" '+(p.cash<t.price?'disabled':'')+' onclick="buy()">Koop '+esc(t.name)+' · '+money(t.price)+'</button><button class="secondary" onclick="skip()">Overslaan</button>'}else if(g.phase==='end')actions.innerHTML='<button class="action" onclick="next()">'+(g.solo?'🎲 VOLGENDE WORP':'Volgende speler ›')+'</button>';else if(g.phase==='destroy')actions.innerHTML=g.players.map((pl,i)=>i!==g.turn&&pl.alive?'<button class="action" onclick="demolish('+i+')">🏗️ Sloop bij '+esc(pl.name)+'</button>':'').join('');else if(g.phase==='finished')actions.innerHTML='<div class="panel">🏆 '+esc(g.players[g.winner].name)+' wint! Clubwaarde: '+money(net(g.winner))+'</div>';else actions.innerHTML='';document.getElementById('status').textContent=g.phase==='roll'?(g.solo?'Jouw club is aan zet. Gooi en bouw verder.':p.name+' is aan zet. Gooi de dobbelstenen.'):g.phase==='buy'?'Vrij contract! Koop of sla over.':g.phase==='destroy'?'Kies het stadion van een tegenstander.':g.phase==='finished'?'Seizoen afgelopen.':'Je staat op '+tile(p.pos).name;const ov=document.getElementById('overlay');if(g.modal){ov.classList.remove('hidden');ov.innerHTML='<div class="dialog"><div style="font-size:45px">'+g.modal.icon+'</div><h2>'+esc(g.modal.title)+'</h2><p>'+esc(g.modal.desc)+'</p><button class="action" onclick="closeModal()">Verder</button></div>'}else ov.classList.add('hidden');if(g.bot&&g.turn===1&&g.phase!=='finished'){clearTimeout(timer);timer=setTimeout(botStep,650)}}
try{const raw=JSON.parse(localStorage.getItem(saveKey)||'null');if(raw&&Array.isArray(raw.players)&&Array.isArray(raw.owners)&&raw.owners.length===24)g=raw}catch(e){}render();
</script></body></html>

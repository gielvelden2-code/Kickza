name: Refresh licensed football data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-football.mjs'
      - '.github/workflows/football-data.yml'
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update football snapshot
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/update-football.mjs
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/football.json data/catalog.json data/history.json
          git diff --cached --quiet || (git commit -m "Refresh football data" && git push)

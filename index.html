async function lookupPlayers(team){directoryClub=team;directoryPlayers=[];directoryBusy=true;directoryError='';directoryTab='players';render();try{const match=apiCatalog?.teams?.find(t=>t.name.toLowerCase()===team.toLowerCase()||(team.toLowerCase()==='psv'&&t.name.toLowerCase()==='psv eindhoven'));const squad=match&&apiCatalog?.squads?.[match.id];if(squad?.length){directoryPlayers=squad.map(p=>({idPlayer:String(p.id),strPlayer:p.name,strThumb:p.photo,strPosition:p.position,strNumber:p.number,strTeam:team,strSport:'Soccer',strNationality:'',dateBorn:'',strHeight:''}));}else{const response=await fetch('https://www.thesportsdb.com/api/v1/json/3/searchplayers.php?t='+encodeURIComponent(team));if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();directoryPlayers=(data.player||[]).filter(p=>p.strSport==='Soccer');if(!directoryPlayers.length)directoryError='Nog geen spelers beschikbaar voor '+team+'. De selectie wordt via API-Football bijgewerkt.'}}catch(e){directoryError='Selectie is nog niet geladen. API-Football verwerkt de gegevens automatisch; probeer het later opnieuw.'}directoryBusy=false;render()}

let passportIndex=0,passportScore=0,passportAnswered=false,passportGuess='';
function passportPool(){const teams=apiCatalog?.teams||[];const squad=apiCatalog?.squads||{};return Object.entries(squad).flatMap(([id,ps])=>{const t=teams.find(x=>String(x.id)===id);return(ps||[]).filter(p=>p.name&&p.position).map(p=>({...p,club:t?.name||'Onbekend'}))}).sort((a,b)=>String(a.id).localeCompare(String(b.id)))}
function passportGame(){const pool=passportPool();if(pool.length<4)return '<h1 class="heading">Voetbalpaspoort</h1><div class="panel empty">Selecties laden. Controleer je internetverbinding als dit blijft staan.</div>';const p=pool[passportIndex%pool.length];const others=pool.filter(x=>String(x.id)!==String(p.id)&&x.name!==p.name);const options=[p,...others.slice((passportIndex*3)%Math.max(1,others.length-3)).slice(0,3)];while(options.length<4){const x=others.find(x=>!options.some(o=>String(o.id)===String(x.id)));if(!x)break;options.push(x)}options.sort((a,b)=>String(a.id).localeCompare(String(b.id)));const team=apiCatalog?.teams?.find(t=>t.name===p.club);return '<h1 class="heading">Voetbalpaspoort</h1><div class="notice">Raad de speler op basis van de actuele API-selectie.</div><div class="panel cardpad"><div class="row"><b>Vraag '+(passportIndex+1)+'</b><b>Score '+passportScore+'</b></div><div style="text-align:center;margin:15px"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#202528" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M5 17c0-3 8-3 8 0M14 9h5M14 12h5M14 15h4"/></svg></div><div class="stat"><span>Club</span><b>'+(team?.logo?'<img src="'+esc(team.logo)+'" style="width:24px;vertical-align:middle;margin-right:6px" alt="">':'')+esc(p.club)+'</b></div><div class="stat"><span>Positie</span><b>'+esc(p.position)+'</b></div>'+(p.age!=null?'<div class="stat"><span>Leeftijd</span><b>'+esc(p.age)+'</b></div>':'')+(p.number!=null?'<div class="stat"><span>Rugnummer</span><b>'+esc(p.number)+'</b></div>':'')+'<div style="display:grid;gap:9px;margin-top:18px">'+options.map(o=>'<button class="install" style="width:100%;text-align:left;display:flex;align-items:center;gap:10px;background:'+(passportAnswered&&String(o.id)===String(p.id)?'#caff00':passportAnswered&&passportGuess===String(o.id)?'#ffb4b4':'#f1f3f5')+'" onclick="passportAnswer('+Number(o.id)+')" '+(passportAnswered?'disabled':'')+'>'+(passportAnswered&&o.photo?'<img src="'+esc(o.photo)+'" alt="" loading="lazy" style="width:38px;height:38px;object-fit:cover;border-radius:50%">':'')+esc(o.name)+'</button>').join('')+'</div>'+(passportAnswered?'<p><b>'+(passportGuess===String(p.id)?'Goed!':'Juiste antwoord: '+esc(p.name))+'</b></p>'+(p.photo?'<img src="'+esc(p.photo)+'" alt="Foto van '+esc(p.name)+'" style="width:100px;height:100px;object-fit:cover;border-radius:14px">':'')+'<div><button class="install" onclick="passportNext()">Volgende speler →</button></div>':'')+'</div>'}
function passportAnswer(id){if(passportAnswered)return;const pool=passportPool(),p=pool[passportIndex%pool.length];passportGuess=String(id);passportAnswered=true;if(String(p.id)===String(id))passportScore++;render()}
function passportNext(){passportIndex++;passportAnswered=false;passportGuess='';render()}
function miniGames(){return '<h1 class="heading">Kickza Games</h1><div class="panel"><div class="stat" onclick="nav(\'ttt\')" style="cursor:pointer"><span>⚽ Tiki-Taka-Toe<div class="sub">Raad de speler · 2 spelers</div></span><b>›</b></div><div class="stat" onclick="nav(\'passport\')" style="cursor:pointer"><span>Voetbalpaspoort<div class="sub">Raad de voetballer · API-selecties</div></span><b>›</b></div></div>'}
function render(){const focus=document.activeElement?.id==='tttSearchInput';const caret=focus?document.activeElement.selectionStart:null;document.getElementById("app").innerHTML='<header class="top"><div class="brand">'+logo+'</div><small>BÈTA • v1.1</small></header><main class="pad">'+(page==="home"||page==="matches"?gamesView():page==="detail"?detail():page==="leagues"?leagueView():page==="league"?leagueDetail():page==="favorites"?'<h1 class="heading">Favorieten</h1><div class="panel">'+(games.filter(g=>fav.includes(g.id)).map(gameRow).join("")||'<div class="empty">Tik op ☆ bij een wedstrijd om hem te bewaren.</div>')+'</div>':page==="games"?miniGames():page==="ttt"?ticTacToe():page==="passport"?passportGame():page==="form"?formRadar():page==="battle"?battle():page==="predictions"?predictions():'<h1 class="heading">Meer</h1><div class="panel"><div class="stat" onclick="nav(\'form\')">⚡ Vormradar <span>›</span></div><div class="stat" onclick="nav(\'games\')">◇ Voetbalspelletjes <span>›</span></div><div class="stat" onclick="nav(\'battle\')">⚔️ Player Battle <span>›</span></div><div class="stat" onclick="nav(\'predictions\')">🏆 Voorspellingen <span>›</span></div><div class="stat" onclick="nav(\'leagues\')">📊 Competities <span>›</span></div></div><div class="notice">Kickza is een demo. Echte data, pushmeldingen en accounts zijn nog niet beschikbaar.</div>')+'</main><nav class="bottom">'+tabs.map(([p,ic,label])=>'<button class="'+(page===p?"active":"")+'" onclick="nav(\''+p+'\')"><span>'+ic+'</span>'+label+'</button>').join("")+'</nav>';if(focus){const input=document.getElementById('tttSearchInput');if(input){input.focus();if(caret!==null)input.setSelectionRange(caret,caret)}}}
try{render();loadApiSnapshot()}catch(e){document.getElementById("app").innerHTML="<header class=\"top\"><div class=\"brand\">Kickza</div></header><main class=\"pad\"><h1>Er ging iets mis bij het laden</h1><p>"+String(e.message)+"</p></main>"};if("serviceWorker"in navigator)navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{});

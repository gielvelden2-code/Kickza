async function clubInfo(cl){
 const normalize=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
 const aliases={'psv':'psv eindhoven','inter':'inter milan','bayern munchen':'bayern munich','manchester united':'manchester united'};
 const wanted=normalize(aliases[normalize(cl)]||cl);
 const existing=(apiCatalog?.teams||[]).find(t=>normalize(t.name)===wanted||normalize(t.name).includes(wanted));
 if(existing){openClub(existing.id);return;}
 try{
  const response=await fetch('https://www.thesportsdb.com/api/v1/json/123/searchteams.php?t='+encodeURIComponent(cl));
  if(!response.ok)throw Error('Clubgegevens niet bereikbaar');
  const data=await response.json();
  const teams=(data.teams||[]).filter(t=>t.strSport==='Soccer');
  const exact=teams.find(t=>normalize(t.strTeam)===wanted)||teams[0];
  if(!exact){alert('Voor '+cl+' zijn nog geen geverifieerde clubgegevens beschikbaar.');return;}
  const team={id:Number(exact.idTeam),name:exact.strTeam,logo:exact.strBadge||'',country:exact.strCountry||'',league:exact.strLeague||''};
  if(!apiCatalog)apiCatalog={teams:[],squads:{}};
  if(!apiCatalog.teams)apiCatalog.teams=[];
  if(!apiCatalog.squads)apiCatalog.squads={};
  if(!apiCatalog.teams.some(t=>Number(t.id)===team.id))apiCatalog.teams.push(team);
  selectedLeagueEntry=null;openClub(team.id);
 }catch(err){alert('Het clubprofiel kon niet worden geladen. Controleer je verbinding en probeer opnieuw.');}
}

function kzFourWin(board,player){for(let r=0;r<6;r++)for(let c=0;c<7;c++)for(const [dr,dc] of [[1,0],[0,1],[1,1],[1,-1]]){let ok=true;for(let k=0;k<4;k++){const rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>=6||cc<0||cc>=7||board[rr*7+cc]!==player){ok=false;break}}if(ok)return true}return false}
function kzFourDrop(col){if(kzBoardWinner||kzBoardTurn!==1)return;let row=-1;for(let r=5;r>=0;r--)if(!kzBoard[r*7+col]){row=r;break}if(row<0)return;kzBoard[row*7+col]=1;if(kzFourWin(kzBoard,1)){kzBoardWinner=1;kzBoardMsg='Gewonnen! Vier op een rij.';render();return}if(kzBoard.every(Boolean)){kzBoardWinner=3;kzBoardMsg='Gelijkspel';render();return}kzBoardTurn=2;const possible=[];for(let c=0;c<7;c++){let r=-1;for(let i=5;i>=0;i--)if(!kzBoard[i*7+c]){r=i;break}if(r>=0){const copy=kzBoard.slice();copy[r*7+c]=2;possible.push({c,win:kzFourWin(copy,2),r})}}let choice=possible.find(x=>x.win);if(!choice){for(const m of possible){const copy=kzBoard.slice();copy[m.r*7+m.c]=1;if(kzFourWin(copy,1)){choice=m;break}}}choice=choice||possible.sort((a,b)=>Math.abs(a.c-3)-Math.abs(b.c-3))[0];if(choice){kzBoard[choice.r*7+choice.c]=2;if(kzFourWin(kzBoard,2)){kzBoardWinner=2;kzBoardMsg='De computer wint.'}else if(kzBoard.every(Boolean)){kzBoardWinner=3;kzBoardMsg='Gelijkspel'}}kzBoardTurn=1;render()}

function kzBoardDice(){if(kzBoardWinner)return;const n=1+Math.floor(Math.random()*6),p=kzBoardTurn-1;let next=Math.min(35,kzBoardPos[p]+n);const start=next;next=kzBoardLadders[next]||kzBoardSnakes[next]||next;kzBoardPos[p]=next;kzBoardRoll=n;kzBoardMsg='Speler '+kzBoardTurn+' gooit '+n+(next!==start?(next>start?' · transferbonus!':' · blessure!'):'');if(next===35){kzBoardWinner=kzBoardTurn;kzBoardMsg+=' · Speler '+kzBoardTurn+' wint!'}else kzBoardTurn=kzBoardTurn===1?2:1;render()}
function kzBoardMemoryPick(i){if(kzBoardLocked||kzBoardFound.includes(i)||kzBoardOpen.includes(i)||kzBoardOpen.length>=2)return;kzBoardOpen.push(i);if(kzBoardOpen.length===2){kzBoardMoves++;const [a,b]=kzBoardOpen;if(kzBoardPairs[a]===kzBoardPairs[b]){kzBoardFound.push(a,b);kzBoardOpen=[];if(kzBoardFound.length===16){kzBoardWinner=1;kzBoardMsg='Alle 8 duo’s gevonden in '+kzBoardMoves+' beurten!'}}else{kzBoardLocked=true;setTimeout(()=>{kzBoardOpen=[];kzBoardLocked=false;if(page==='boardGame'&&kzBoardMode==='memory')render()},900)}}render()}

let kzBigMode='penalty',kzBigState=null;
function kzBigStart(mode){kzBigMode=mode;if(mode==='penalty')kzBigState={round:0,us:0,them:0,log:[]};if(mode==='manager')kzBigState={round:1,points:0,budget:500,attack:55,defense:55,morale:60,log:[]};if(mode==='territory')kzBigState={cells:Array(16).fill(0),turn:1,moves:0,log:'Verover velden om meer terrein te bezitten.'};page='bigGame';render()}
function kzBigMove(v){const s=kzBigState;if(!s)return;if(kzBigMode==='penalty'){if(s.round>=5)return;const keeper=Math.floor(Math.random()*3),goal=Number(v)!==keeper||Math.random()<.2;if(goal)s.us++;const opponent=Math.floor(Math.random()*3),save=Math.random()<.36;if(!save)s.them++;s.round++;s.log.unshift('Ronde '+s.round+': '+(goal?'Goal!':'Keeper redt')+' · '+(save?'Jij stopt de penalty':'Tegendoelpunt'));}if(kzBigMode==='manager'){if(v==='train'){s.attack=Math.min(99,s.attack+7);s.budget-=70;s.morale=Math.max(0,s.morale-3)}if(v==='defend'){s.defense=Math.min(99,s.defense+7);s.budget-=70;s.morale=Math.max(0,s.morale-3)}if(v==='rest')s.morale=Math.min(99,s.morale+13);if(v==='play'){const power=s.attack*.55+s.defense*.25+s.morale*.2,win=Math.random()*100<power;s.points+=win?3:0;s.budget+=win?180:80;s.morale=Math.max(0,Math.min(99,s.morale+(win?5:-6)));s.log.unshift('Speelronde '+s.round+': '+(win?'Gewonnen +3 punten':'Verloren') );s.round++}}if(kzBigMode==='territory'){const i=Number(v);if(s.cells[i]||s.moves>=16)return;s.cells[i]=1;s.moves++;const open=s.cells.map((x,i)=>x?-1:i).filter(x=>x>=0);if(open.length){let best=open[0],score=-1;for(const n of open){const near=[n-4,n+4,n%4?n-1:-1,n%4<3?n+1:-1].filter(j=>j>=0&&j<16&&s.cells[j]===2).length;if(near>score){score=near;best=n}}s.cells[best]=2;s.moves++}s.log='Jij '+s.cells.filter(x=>x===1).length+' velden · Computer '+s.cells.filter(x=>x===2).length+' velden';}render()}
function kzBigScreen(){const s=kzBigState,back='<button class="back" onclick="nav(\'games\')">‹ Games</button>';if(!s)return back;if(kzBigMode==='penalty')return back+'<h1 class="heading">Penalty Shootout</h1><div class="panel cardpad" style="text-align:center"><div class="sub">Vijf penaltyrondes · kies waar je schiet</div><h1 style="font-size:42px">'+s.us+' – '+s.them+'</h1><div style="height:140px;border:5px solid #111;border-bottom:0;border-radius:15px 15px 0 0;background:linear-gradient(#b9f1ba,#68a967);display:flex;align-items:end;justify-content:center;font-size:52px">🥅</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0">'+['Links','Midden','Rechts'].map((x,i)=>'<button class="install" '+(s.round>=5?'disabled':'onclick="kzBigMove('+i+')"')+'>'+x+'</button>').join('')+'</div><b>'+(s.round>=5?(s.us>s.them?'Je wint!':s.us===s.them?'Gelijkspel':'Je verliest'):'Ronde '+(s.round+1)+'/5')+'</b>'+s.log.map(x=>'<div class="stat">'+esc(x)+'</div>').join('')+'<button class="install" onclick="kzBigStart(\'penalty\')">Opnieuw</button></div>';if(kzBigMode==='manager')return back+'<h1 class="heading">Clubmanager</h1><div class="notice">Train je elftal, beheer je budget en speel een competitie tegen virtuele tegenstanders.</div><div class="panel cardpad"><h2>Speelronde '+s.round+' · '+s.points+' punten</h2>'+[['Budget','€'+s.budget],['Aanval',s.attack],['Verdediging',s.defense],['Teamgeest',s.morale]].map(x=>'<div class="stat"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')+'<div style="display:grid;gap:8px;margin-top:14px"><button class="primary" onclick="kzBigMove(\'play\')">Speel wedstrijd</button><button class="install" '+(s.budget<70?'disabled':'')+' onclick="kzBigMove(\'train\')">Aanval trainen · €70</button><button class="install" '+(s.budget<70?'disabled':'')+' onclick="kzBigMove(\'defend\')">Verdediging trainen · €70</button><button class="install" onclick="kzBigMove(\'rest\')">Teamgesprek · +teamgeest</button></div>'+s.log.slice(0,5).map(x=>'<div class="stat">'+esc(x)+'</div>').join('')+'</div><button class="install" onclick="kzBigStart(\'manager\')">Nieuw seizoen</button>';return back+'<h1 class="heading">Stadionstrijd</h1><div class="notice">Een tactisch gebiedsspel tegen de computer. Claim een veld; de computer probeert zijn terrein uit te breiden.</div><div class="panel cardpad"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">'+s.cells.map((v,i)=>'<button onclick="kzBigMove('+i+')" '+(v?'disabled':'')+' style="aspect-ratio:1;border-radius:10px;border:1px solid #999;font-size:24px;background:'+(v===1?'#d2ff00':v===2?'#111':'#eaeaea')+';color:'+(v===2?'white':'#111')+'">'+(v===1?'K':v===2?'●':'＋')+'</button>').join('')+'</div><p>'+esc(s.log)+'</p>'+(s.moves>=16?'<h2>'+(s.cells.filter(x=>x===1).length>s.cells.filter(x=>x===2).length?'Jij wint!':'Gelijkspel of computer wint')+'</h2>':'')+'<button class="install" onclick="kzBigStart(\'territory\')">Nieuw duel</button></div>'}


let kzStrategyMode='draft',kzStrategy=null;
function kzStrategyStart(mode){kzStrategyMode=mode;if(mode==='draft')kzStrategy={round:0,team:[],rival:[],budget:100,log:'Kies vijf spelers binnen je budget.'};if(mode==='auction')kzStrategy={round:0,coins:[100,100],teams:[[],[]],turn:0,log:'Bied om spelers en bouw je elftal.'};if(mode==='tactics')kzStrategy={board:Array(25).fill(0),turn:1,round:0,score:[0,0],log:'Verplaats je spelers naar het doelgebied.'};page='strategyGame';render()}
function kzStrategyCandidates(){return kzCareers.slice(0,24).map((p,i)=>({name:p.name,cost:10+(i*7)%25,power:45+(i*13)%50}));}
function kzStrategyPick(i){const s=kzStrategy,p=kzStrategyCandidates()[i];if(!s||!p)return;if(kzStrategyMode==='draft'){if(s.team.length>=5||s.team.some(x=>x.name===p.name)||s.budget<p.cost)return;s.team.push(p);s.budget-=p.cost;s.round++;const rival=kzStrategyCandidates().filter(x=>!s.rival.some(y=>y.name===x.name)&&!s.team.some(y=>y.name===x.name)).sort((a,b)=>b.power-a.power)[0];if(rival)s.rival.push(rival);if(s.team.length===5){const a=s.team.reduce((n,x)=>n+x.power,0),b=s.rival.reduce((n,x)=>n+x.power,0);s.log='Jouw team '+a+' kracht · Rivalen '+b+' kracht · '+(a>=b?'Jij wint!':'Rivalen winnen!')}else s.log='Gekozen: '+p.name+' · Nog '+(5-s.team.length)+' plekken'}if(kzStrategyMode==='auction'){if(s.round>=8||s.coins[s.turn]<p.cost||s.teams.flat().some(x=>x.name===p.name))return;s.teams[s.turn].push(p);s.coins[s.turn]-=p.cost;s.log='Speler '+(s.turn+1)+' koopt '+p.name+' voor €'+p.cost+' miljoen';s.turn=1-s.turn;s.round++;if(s.round>=8){const a=s.teams[0].reduce((n,x)=>n+x.power,0),b=s.teams[1].reduce((n,x)=>n+x.power,0);s.log+=' · Eindstand: '+a+' tegen '+b+' teamkracht'}}render()}
function kzTacticsMove(i){const s=kzStrategy;if(!s||kzStrategyMode!=='tactics'||s.round>=20||s.board[i])return;s.board[i]=1;s.round++;if(i<5)s.score[0]++;const open=s.board.map((v,j)=>v?-1:j).filter(j=>j>=0);if(open.length){const choice=open.sort((a,b)=>Math.abs((a%5)-2)-Math.abs((b%5)-2))[0];s.board[choice]=2;if(choice>=20)s.score[1]++}s.log='Jij '+s.score[0]+' goals · Computer '+s.score[1]+' goals';if(s.round>=12||s.board.every(Boolean)){s.round=20;s.log+=' · '+(s.score[0]>s.score[1]?'Jij wint!':s.score[0]===s.score[1]?'Gelijkspel':'Computer wint!')}render()}
function kzStrategyScreen(){const s=kzStrategy,back='<button class="back" onclick="nav(\'games\')">‹ Alle spellen</button>';if(!s)return back;const players=kzStrategyCandidates();if(kzStrategyMode==='tactics')return back+'<h1 class="heading">Tactiekstrijd</h1><div class="notice">Een voetbalbordspel tegen de computer. Claim vakken in het bovenste doelgebied om te scoren. De computer scoort in het onderste doelgebied.</div><div class="panel cardpad"><h2>Jij '+s.score[0]+' – '+s.score[1]+' Computer</h2><div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px">'+s.board.map((v,i)=>'<button onclick="kzTacticsMove('+i+')" '+(v||s.round>=20?'disabled':'')+' style="aspect-ratio:1;border:2px solid '+(i<5||i>=20?'#9fc600':'#bbb')+';border-radius:8px;background:'+(v===1?'#d2ff00':v===2?'#161616':'#edf3e8')+';color:'+(v===2?'white':'#111')+';font-size:20px">'+(v===1?'K':v===2?'●':'·')+'</button>').join('')+'</div><p>'+esc(s.log)+'</p><button class="install" onclick="kzStrategyStart(\'tactics\')">Nieuw duel</button></div>';const draft=kzStrategyMode==='draft',done=draft?s.team.length>=5:s.round>=8;return back+'<h1 class="heading">'+(draft?'Ultimate Draft':'Transferveiling')+'</h1><div class="notice">'+(draft?'Selecteer vijf spelers. De computer stelt een rivalenteam samen. Blijf binnen je budget.':'Twee spelers op één telefoon kopen om de beurt spelers. Wie heeft na acht aankopen het sterkste team?')+'</div><div class="panel cardpad"><h2>'+(draft?'Budget €'+s.budget+' miljoen · '+s.team.length+'/5 spelers':'Speler '+(s.turn+1)+' aan zet · Budgetten €'+s.coins.join(' / €')+' miljoen')+'</h2><div class="sub">'+esc(s.log)+'</div><div style="display:grid;gap:6px;margin-top:12px">'+players.map((p,i)=>{const owned=draft?s.team.some(x=>x.name===p.name):s.teams.flat().some(x=>x.name===p.name);const disabled=done||owned||(draft?s.budget:s.coins[s.turn])<p.cost;return '<button class="stat" style="width:100%;border:1px solid #ddd;background:transparent;color:inherit;text-align:left;font:inherit;border-radius:9px" '+(disabled?'disabled':'onclick="kzStrategyPick('+i+')"')+'><span><b>'+esc(p.name)+'</b><span class="sub" style="display:block">Kracht '+p.power+' · €'+p.cost+' mln</span></span><span>'+(owned?'✓':'＋')+'</span></button>'}).join('')+'</div><h3>'+(draft?'Mijn selectie':'Selecties')+'</h3>'+(draft?s.team.map(p=>'<div class="stat">'+esc(p.name)+'</div>').join(''):s.teams.map((team,i)=>'<div class="stat">Speler '+(i+1)+': '+esc(team.map(x=>x.name).join(', ')||'Nog niemand')+'</div>').join(''))+'<button class="install" onclick="kzStrategyStart(\''+kzStrategyMode+'\')">Opnieuw spelen</button></div>'}

function kzEmpireRefresh(){if(!kzEmpire)return;const now=Date.now(),elapsed=Math.max(0,now-(kzEmpire.lastDice||now)),regen=Math.floor(elapsed/180000);if(regen>0){kzEmpire.dice=Math.min(60,kzEmpire.dice+regen);kzEmpire.lastDice=now-(elapsed%180000);kzEmpireSave()}}
function kzEmpireAddLog(msg){kzEmpire.log.unshift(msg);kzEmpire.log=kzEmpire.log.slice(0,12)}
function kzEmpireSticker(){const idx=Math.floor(Math.random()*kzEmpireStickers.length),name=kzEmpireStickers[idx];if(!kzEmpire.stickers.includes(name)){kzEmpire.stickers.push(name);kzEmpireAddLog('Nieuwe sticker: '+name+'!')}else{kzEmpire.coins+=120;kzEmpireAddLog('Dubbele sticker: +120 munten')}if(kzEmpire.stickers.length===kzEmpireStickers.length){kzEmpire.coins+=1500;kzEmpireAddLog('Album compleet! +1.500 munten')}}
function kzEmpireRoll(){const e=kzEmpire;if(!e)return;kzEmpireRefresh();if(e.dice<e.multiplier){e.modal='Je dobbelstenen zijn op. Kom later terug of ontvang je dagbonus.';render();return}const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6),steps=a+b;e.dice-=e.multiplier;e.roll=[a,b];e.round++;const old=e.pos;e.pos=(old+steps)%kzEmpireTiles.length;if(old+steps>=kzEmpireTiles.length){e.coins+=200*e.multiplier;kzEmpireAddLog('Rondje stadion: +'+(200*e.multiplier)+' munten')}const [name,type]=kzEmpireTiles[e.pos],m=e.multiplier;let reward=0;

if(type==='card'){const outcomes=[['Nieuwe sponsor!',250],['Boete voor gele kaarten',-100],['Transferwinst',350],['Blessurekosten',-80],['Supportersactie',180]];const card=outcomes[Math.floor(Math.random()*outcomes.length)];reward=card[1]*m;e.coins=Math.max(0,e.coins+reward);e.modal=card[0]+' · '+(reward>0?'+':'')+reward+' munten';kzEmpireAddLog(e.modal)}
e.xp+=steps*m;e.event+=steps*m;if(e.round%5===0)kzEmpireSticker();if(e.event>=100){e.event-=100;e.coins+=650;e.dice=Math.min(60,e.dice+8);kzEmpireAddLog('Supportersfestival voltooid! +650 munten en 8 dobbelstenen')}kzEmpireSave();render()}
function kzEmpireBuild(i){const e=kzEmpire;if(!e||e.build[i]>=5)return;const cost=(e.level*200)+(e.build[i]+1)*150;if(e.coins<cost){e.modal='Niet genoeg munten voor deze upgrade.';render();return}e.coins-=cost;e.build[i]++;e.xp+=50;kzEmpireAddLog(['Tribune','Trainingsveld','Fanshop','Museum','Lichtmasten'][i]+' verbeterd naar niveau '+e.build[i]);if(e.build.every(x=>x===5)){e.level++;e.build=[0,0,0,0,0];e.coins+=1000;e.dice=Math.min(60,e.dice+20);e.modal='Nieuw stadion bereikt! Niveau '+e.level+' · +1.000 munten en 20 dobbelstenen'}kzEmpireSave();render()}

button class="primary" style="width:100%;min-height:56px;font-size:19px;margin-top:8px" onclick="kzEmpireRoll()">🎲 GOOI DOBBELSTENEN</button><button class="install" style="margin-top:8px" onclick="kzEmpireMulti()">Vermenigvuldiger ×'+e.multiplier+' wijzigen</button></div></div><div class="panel cardpad" style="margin-top:12px"><h2 style="margin-top:0">Bouw je stadion</h2><div class="sub">Upgrade alle vijf onderdelen naar niveau 5 om het volgende stadion te bereiken.</div>'+names.map((name,i)=>{const cost=e.level*200+(e.build[i]+1)*150;return '<div class="stat"><span><b>'+name+'</b><span class="sub" style="display:block">Niveau '+e.build[i]+'/5</span></span><button class="install" '+(e.build[i]>=5||e.coins<cost?'disabled':'onclick="kzEmpireBuild('+i+')"')+'>'+(e.build[i]>=5?'Voltooid':'🪙 '+cost)+'</button></div>'}).join('')+'</div><div class="panel cardpad" style="margin-top:12px"><h2 style="margin-top:0">Supportersfestival</h2><div class="kz-progress"><span style="width:'+e.event+'%"></span></div><p class="sub">'+e.event+'/100 punten · Verdien 650 munten en 8 dobbelstenen</p><button class="install" onclick="kzEmpireDaily()" '+(e.lastDaily===new Date().toISOString().slice(0,10)?'disabled':'')+'>🎁 '+(e.lastDaily===new Date().toISOString().slice(0,10)?'Dagbonus ontvangen':'Ontvang gratis dagbonus')+'</button></div><div class="panel cardpad" style="margin-top:12px"><h2 style="margin-top:0">Voetbalstickers '+e.stickers.length+'/12</h2><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px">'+kzEmpireStickers.map(x=>'<div style="background:'+(e.stickers.includes(x)?'#d2ff00':'#e8ebed')+';border-radius:9px;padding:12px 3px;text-align:center;font-size:10px;font-weight:700">'+(e.stickers.includes(x)?'★ ':'🔒 ')+esc(x)+'</div>').join('')+'</div><p class="sub">Iedere vijf worpen krijg je een sticker.</p></div><div class="panel cardpad" style="margin-top:12px"><h2 style="margin-top:0">Wedstrijdverslag</h2>'+e.log.slice(0,5).map(x=>'<div class="stat">'+esc(x)+'</div function kzClubSetup(n,vsBot=false){kzClubGame={vsBot,players:Array.from({length:n},(_,i)=>({name:vsBot&&i===1?'Kickza FC (CPU)':'Speler '+(i+1),cash:1500,pos:0,alive:true})),owner:Array(20).fill(-1),upgrade:Array(20).fill(0),turn:0,round:1,phase:'roll',dice:[],log:['Iedere speler begint met 1.500 Kickza-munten op START. Bij elke passage of landing op START ontvang je 200 munten.'],winner:-1,maxRounds:40,lastCard:null,cardHistory:[],cardDeck:0,bonusDeck:0};kzClubSave();page='clubBoard';render()}

function kzClubRename(i,name){if(!kzClubGame||!kzClubGame.players[i])return;kzClubGame.players[i].name=String(name).trim().slice(0,18)||'Speler '+(i+1);kzClubSave()}
function kzClubLog(m){kzClubGame.log.unshift(m);kzClubGame.log=kzClubGame.log.slice(0,12)}
function kzClubPay(player,amount,to){player.cash-=amount;if(to>=0)kzClubGame.players[to].cash+=amount;if(player.cash<0){player.alive=false;for(let i=0;i<20;i++)if(kzClubGame.owner[i]===kzClubGame.players.indexOf(player)){kzClubGame.owner[i]=-1;kzClubGame.upgrade[i]=0}kzClubLog(player.name+' is failliet!')}}

function kzClubDrawCard(kind){const g=kzClubGame,p=g.players[g.turn],deck=kind==='chance'?kzClubChanceCards:kzClubBonusCards,key=kind==='chance'?'cardDeck':'bonusDeck';const card=deck[(g[key]||0)%deck.length];g[key]=(g[key]||0)+1;let amount=card.amount??((card.perAsset||0)*g.owner.filter(o=>o===g.turn).length);if(card.goStart){p.pos=0;amount=200}if(amount<0)kzClubPay(p,-amount,-1);else p.cash+=amount;g.lastCard={kind,title:card.title,desc:card.desc,amount};g.cardHistory=g.cardHistory||[];g.cardHistory.unshift({...g.lastCard,round:g.round});g.cardHistory=g.cardHistory.slice(0,30);g.phase='card';kzClubLog((kind==='chance'?'Kanskaart':'Bonuskaart')+': '+card.title+' ('+(amount>0?'+':'')+amount+')');kzClubSave();render()}
function kzClubCloseCard(){const g=kzClubGame;if(!g||g.phase!=='card')return;g.phase='end';g.lastCard=null;kzClubSave();render()}
function kzClubNetWorth(i){const g=kzClubGame;return g.players[i].cash+g.owner.reduce((sum,o,j)=>sum+(o===i?(kzClubAssets[j].price||0)+g.upgrade[j]*Math.round((kzClubAssets[j].price||0)*.6):0),0)}
function kzClubFinish(){const g=kzClubGame;if(!g)return;g.winner=g.players.map((p,i)=>({i,worth:p.alive?kzClubNetWorth(i):-Infinity})).sort((a,b)=>b.worth-a.worth)[0].i;g.phase='finished';kzClubLog('Seizoen voltooid! '+g.players[g.winner].name+' wint met het hoogste clubvermogen.');kzClubSave();render()}

function kzClubRoll(){const g=kzClubGame;if(!g||g.phase!=='roll'||g.winner>=0)return;const p=g.players[g.turn],a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6),old=p.pos;p.pos=(p.pos+a+b)%20;g.dice=[a,b];if(old+a+b>=20){p.cash+=200;kzClubLog(p.name+' passeert of bereikt START: +200 Kickza-munten')}const tile=kzClubAssets[p.pos],idx=p.pos;kzClubLog(p.name+' gooit '+a+' + '+b+' en landt op '+tile.name);g.phase='end';if(tile.kind==='player'||tile.kind==='staff'){const owner=g.owner[idx];if(owner===-1){g.phase='buy'}else if(owner!==g.turn){const rent=tile.rent*(1+g.upgrade[idx]*2);const previous=p.cash;kzClubPay(p,rent,owner);g.lastRent={from:p.name,to:g.players[owner].name,tile:tile.name,amount:rent,paid:Math.min(previous,rent)};g.phase='rent';kzClubLog(p.name+' betaalt '+rent+' munten aan '+g.players[owner].name+' voor '+tile.name)}}else if(tile.kind==='bonus'){kzClubDrawCard('bonus');return}else if(tile.kind==='start'){kzClubLog('START bereikt: de 200 Kickza-munten zijn al uitbetaald')}else if(tile.kind==='match'){const strength=kzClubStrength(g.turn),won=Math.random()<Math.min(.85,.35+strength/250);const prize=won?260:60;p.cash+=prize;kzClubLog(won?'Wedstrijd gewonnen! +'+prize:'Wedstrijd verloren. +'+prize)}else if(tile.kind==='chance'){kzClubDrawCard('chance');return}kzClubSave();render()}
function kzClubStrength(id){const g=kzClubGame;return g.owner.reduce((sum,o,i)=>sum+(o===id?10+g.upgrade[i]*8:0),0)}
function kzClubBuy(){const g=kzClubGame;if(!g||g.phase!=='buy')return;const p=g.players[g.turn],i=p.pos,t=kzClubAssets[i];if(g.owner[i]!==-1)return;if(p.cash<t.price){kzClubLog('Onvoldoende geld voor '+t.name);g.phase='end'}else{p.cash-=t.price;g.owner[i]=g.turn;g.phase='end';kzClubLog(p.name+' koopt '+t.name+' voor '+t.price)}kzClubSave();render()}
function kzClubCloseRent(){const g=kzClubGame;if(!g||g.phase!=='rent')return;g.phase='end';g.lastRent=null;kzClubSave();render()}
function kzClubSkip(){if(kzClubGame?.phase!=='buy')return;kzClubGame.phase='end';kzClubLog('Contract overgeslagen');kzClubSave();render()}
function kzClubUpgrade(i){const g=kzClubGame;if(!g||g.phase!=='end'||g.owner[i]!==g.turn||g.upgrade[i]>=3)return;const cost=Math.round(kzClubAssets[i].price*.6)*(g.upgrade[i]+1),p=g.players[g.turn];if(p.cash<cost)return;p.cash-=cost;g.upgrade[i]++;kzClubLog(kzClubAssets[i].name+' verbeterd naar niveau '+g.upgrade[i]);kzClubSave();render()}
function kzClubNext(){const g=kzClubGame;if(!g||g.phase!=='end')return;const alive=g.players.filter(x=>x.alive);if(alive.length===1){g.winner=g.players.indexOf(alive[0]);kzClubSave();render();return}const prev=g.turn;do{g.turn=(g.turn+1)%g.players.length}while(!g.players[g.turn].alive&&g.turn!==prev);if(g.turn<=prev)g.round++;if(g.round>(g.maxRounds||40)){kzClubFinish();return}g.phase='roll';g.dice=[];kzClubSave();render()}
function kzClubBotTurn(){const g=kzClubGame;if(!g||!g.vsBot||g.turn!==1||g.winner>=0)return;if(g.phase==='roll'){kzClubRoll();return}if(g.phase==='card'){kzClubCloseCard();return}if(g.phase==='rent'){kzClubCloseRent();return}if(g.phase==='buy'){const p=g.players[1],tile=kzClubAssets[p.pos];if(p.cash>=tile.price+160)kzClubBuy();else kzClubSkip();return}if(g.phase==='end'){const owned=g.owner.map((o,i)=>o===1&&g.upgrade[i]<3?i:-1).filter(i=>i>=0);const best=owned.sort((a,b)=>kzClubAssets[b].rent-kzClubAssets[a].rent)[0];if(best!==undefined){const cost=Math.round(kzClubAssets[best].price*.6)*(g.upgrade[best]+1);if(g.players[1].cash>cost+250)kzClubUpgrade(best)}kzClubNext()}}

nde '+Math.min(g.round,g.maxRounds||40)+'/'+(g.maxRounds||40)+' · '+esc(p.name)+' is aan zet. Koop spelers en staf, verdien wedstrijdpremies en ontvang vergoedingen wanneer anderen op jouw contracten landen.</div><div class="panel cardpad"><div style="display:grid;grid-template-columns:repeat('+g.players.length+',minmax(0,1fr));gap:5px">'+g.players.map((pl,i)=>'<div style="background:'+(g.turn===i?'#d2ff00':'#f0f1f1')+';border-radius:10px;padding:8px 4px;text-align:center;opacity:'+(pl.alive?1:.4)+'"><input aria-label="Naam speler '+(i+1)+'" value="'+esc(pl.name)+'" onchange="kzClubRename('+i+',this.value)" style="width:100%;border:0;background:transparent;text-align:center;font-weight:800;font-size:12px;color:#111"><div>'+tokens[i]+' '+pl.cash+' 🪙</div><small>'+g.owner.filter(x=>x===i).length+' contracten</small></div>').join('')+'</div></div><div class="kz-club-scene"><div class="kz-club-world '+(kzClubView==='top'?'top':'')+'"><div class="kz-club-grid">'+perimeter.map((n,i)=>n>=0?field(n):'<div class="kz-club-center">'+(i===14?'<div class="kz-stadium-structure"><div class="kz-stadium-stand kz-stand-top"></div><div class="kz-stadium-stand kz-stand-left"></div><div class="kz-stadium-stand kz-stand-right"></div><div class="kz-stadium-pitch"><img src="assets/kickza-board-mark.svg" alt="Kickza-logo" class="kz-stadium-logo"><div class="kz-stadium-line"></div><div class="kz-stadium-circle"></div><div class="kz-stadium-goal"></div></div></div><b>CLUB TYCOON</b>':'')+'</div>').join('')+'</div></div></div><div class="panel cardpad"><button class="install" onclick="kzClubCamera()">◈ Camera: '+(kzClubView==='first'?'spelerperspectief':'bovenaanzicht')+'</button><h2 style="margin-bottom:6px">'+esc(tile.name)+'</h2><div class="sub">'+(tile.kind==='player'?'Spelerscontract':tile.kind==='staff'?'Stafcontract':'Voetbalbord')+' · '+(g.dice.length?'🎲 '+g.dice.join(' + '):'Klaar om te gooien')+'</div>'+(g.winner>=0?'<h2>🏆 '+esc(g.players[g.winner].name)+' wint!</h2><p>Clubvermogen: let kzNews=[],kzNewsFilter='Alles',kzNewsLoading=false,kzNewsError='',kzNewsUpdated='',kzNewsLoadedAt=0;
const kzNewsCategories=['Alles','Transfers','Trainers','Wedstrijden','Overig'];
function kzNewsCategory(a){const s=(a.title+' '+(a.description||'')).toLowerCase();if(/transfer|signs |signed |signing|joins |deal |loan |move to |contract|transfert|transfers|transfervrij|versterking|overstap|huurdeal|mercato/.test(s))return 'Transfers';if(/coach|manager|press conference|press briefing|trainer|persconferentie|simeone|arteta|guardiola|slot says|ten hag|tuchel says/.test(s))return 'Trainers';if(/match|fixture|goal|win over|defeat|draw against|wedstrijd|uitslag|champions league|premier league|eredivisie/.test(s))return 'Wedstrijden';return 'Overig'}
function kzNewsSafeUrl(url){try{const u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:''}catch(e){return ''}}
function kzNewsTime(a){const n=Date.parse(a.pubDate||a.date||'');return Number.isFinite(n)?n:0}
function kzNewsDate(a){const n=kzNewsTime(a);return n?new Date(n).toLocaleString('nl-NL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Datum onbekend'}
function kzNewsFilterSet(f){kzNewsFilter=f;render()}
function kzNewsView(){const list=kzNews.filter(a=>kzNewsFilter==='Alles'||kzNewsCategory(a)===kzNewsFilter);return '<div class="kz-news-head"><h1 class="heading">Voetbalnieuws</h1><button class="install" onclick="loadNews(true)">↻ Vernieuwen</button></div><div class="sub" style="margin-bottom:12px">Transfers, persconferenties en voetbalnieuws uit externe bronnen · '+(kzNewsUpdated?'Bijgewerkt '+esc(kzNewsUpdated):'Nog niet bijgewerkt')+'</div><div class="kz-news-filter">'+kzNewsCategories.map(f=>'<button class="'+(kzNewsFilter===f?'active':'')+'" onclick="kzNewsFilterSet('+JSON.stringify(f).replace(/"/g,'&quot;')+')">'+f+'</button>').join('')+'</div>'+(kzNewsError?'<div class="notice">'+esc(kzNewsError)+'</div>':'')+(kzNewsLoading&&!kzNews.length?'<div class="kz-news-empty">Nieuws ophalen…</div>':list.length?'<div class="panel" style="overflow:hidden">'+list.map(a=>{const link=kzNewsSafeUrl(a.link);if(!link)return '';const pic=kzNewsSafeUrl(a.image||'');return '<a class="kz-news-card kz-news-link" href="'+esc(link)+'" target="_blank" rel="noopener noreferrer">'+(pic?'<img src="'+esc(pic)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">':'')+'<div><span class="sub">'+esc(kzNewsCategory(a))+'</span><b>'+esc(a.title||'Voetbalnieuws')+'</b><div class="kz-news-meta">'+esc(a.source||'Bron')+' · '+esc(kzNewsDate(a))+'</div></div></a>'}).join('')+'</div>':'<div class="kz-news-empty">Geen nieuws in deze categorie beschikbaar. Probeer een andere categorie of vernieuw de pagina.</div>')+'<p class="sub" style="margin-top:14px">Klik op een bericht om het volledige artikel bij de oorspronkelijke uitgever te lezen. Kickza publiceert geen overgenomen artikelen.</p>'}
function kzHomeNews(){return '<section class="kz-news-hero"><span style="color:#d2ff00;font-weight:800">KICKZA NIEUWS</span><h2>Het laatste voetbalnieuws</h2><p style="color:#d9ded9">Transfers, uitspraken van trainers en nieuws rond wedstrijden.</p><button onclick="nav(\'news\')">Bekijk het nieuws ›</button></section>'}
async function loadNews(force=false){if(kzNewsLoading||(!force&&Date.now()-kzNewsLoadedAt<300000))return;kzNewsLoading=true;kzNewsError='';if(page==='news'||page==='home')render();try{const response=await fetch('./data/news.json?ts='+(force?Date.now():Math.floor(Date.now()/300000)),{cache:'no-store'});if(!response.ok)throw Error('Nieuwsbestand niet bereikbaar');const d=await response.json();if(!Array.isArray(d.articles))throw Error('Ongeldig nieuwsbestand');kzNews=d.articles.filter(a=>a&&a.title&&kzNewsSafeUrl(a.link)).sort((a,b)=>kzNewsTime(b)-kzNewsTime(a)).slice(0,80);kzNewsUpdated=d.updatedAt?new Date(d.updatedAt).toLocaleString('nl-NL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';kzNewsLoadedAt=Date.now();if(!kzNews.length)kzNewsError='De nieuwsbronnen hebben momenteel geen berichten opgeleverd.'}catch(e){kzNewsError='Het nieuws kan momenteel niet worden geladen. Probeer het later opnieuw.'}finally{kzNewsLoading=false;if(page==='news')render()}}

function render(){const active=document.activeElement;const focusId=active&&['tttSearchInput','kzTopSearchInput','kzCareerSearchInput'].includes(active.id)?active.id:null;const caret=focusId?active.selectionStart:null;const content=page==='passport'?passportGame():page==='ttt'?ticTacToe():page==='boardGame'?kzBoardScreen():page==='bigGame'?kzBigScreen():page==='strategyGame'?kzStrategyScreen():page==='empireGame'?kzEmpireScreen():page==='clubBoard'?kzClubScreen():miniGames();document.getElementById('app').innerHTML='<header class="top"><div class="brand">'+logo+'</div><small>GAMES</small></header><main class="pad">'+content+'</main>';if(focusId){const input=document.getElementById(focusId);if(input){input.focus();if(caret!==null&&input.setSelectionRange)input.setSelectionRange(caret,caret)}}}
page='games';try{render()}catch(e){document.getElementById("app").innerHTML="<header class=\"top\"><div class=\"brand\">Kickza</div></header><main class=\"pad\"><h1>Er ging iets mis bij het laden</h1><p>"+String(e.message)+"</p></main>"};if("serviceWorker"in navigator)navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{});

if(typeof location!=='undefined'&&location.hash){const route=location.hash.slice(1);if(route==='top10'){kzStartTop10();kzGameMode='top10';nav('passport')}else if(route==='passport'){kzGameMode='chapters';nav('passport')}else if(route==='ttt')nav('ttt')}
</script></body></html>

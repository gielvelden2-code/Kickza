let catalogQuery='',catalogCountry='Alles';
function countryFlag(l){const x=catalog.find(c=>c.leagues.some(z=>z.name===l));return x?x.flag:'🌍'}
function clubCatalog(){const q=catalogQuery.toLocaleLowerCase('nl');let items=catalog.filter(c=>catalogCountry==='Alles'||catalogCountry===c.country).flatMap(c=>c.leagues.map(l=>({...l,country:c.country,flag:c.flag}))).filter(l=>(l.name+' '+l.country+' '+l.clubs.join(' ')).toLocaleLowerCase('nl').includes(q));return '<h1 class="heading">Competities & clubs</h1><div class="notice">Clubcatalogus ter oriëntatie. Deelnemers per seizoen worden na API-koppeling bijgewerkt.</div><input class="search" id="catalogSearch" placeholder="Zoek competitie, land of club" value="'+esc(catalogQuery)+'" oninput="catalogQuery=this.value;updateCatalog()"><div class="filters" style="margin-top:12px">'+['Alles',...catalog.map(c=>c.country)].map(c=>'<button class="'+(catalogCountry===c?'active':'')+'" onclick="catalogCountry='+JSON.stringify(c).replace(/"/g,'&quot;')+';render()">'+(c==='Alles'?'🌍 Alles':catalog.find(x=>x.country===c).flag+' '+esc(c))+'</button>').join('')+'</div><div id="catalogResults">'+catalogResults(items)+'</div>'}
function catalogResults(items){return items.length?items.map(l=>'<div class="section"><span>'+l.flag+' '+esc(l.name)+'</span><span class="sub">'+esc(l.country)+'</span></div><div class="panel">'+l.clubs.map(cl=>'<div class="stat clubrow"><span class="crest">'+esc(cl.charAt(0))+'</span><span>'+esc(cl)+'</span><button class="star" aria-label="Club bekijken" onclick="clubInfo('+JSON.stringify(cl).replace(/"/g,'&quot;')+')">›</button></div>').join('')+'</div>').join(''):'<div class="panel empty">Geen clubs of competities gevonden.</div>'}
function updateCatalog(){const q=catalogQuery.toLocaleLowerCase('nl');const items=catalog.filter(c=>catalogCountry==='Alles'||catalogCountry===c.country).flatMap(c=>c.leagues.map(l=>({...l,country:c.country,flag:c.flag}))).filter(l=>(l.name+' '+l.country+' '+l.clubs.join(' ')).toLocaleLowerCase('nl').includes(q));document.getElementById('catalogResults').innerHTML=catalogResults(items)}
async function clubInfo(cl){
 const normalize=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
 const aliases={'psv':'psv eindhoven','inter':'inter milan','bayern munchen':'bayern munich','manchester united':'manchester united'};
 const wanted=normalize(aliases[normalize(cl)]||cl);
 const existing=(apiCatalog?.teams||[]).find(t=>normalize(t.name)===wanted||normalize(t.name).includes(wanted));
 if(existing){openClub(existing.id);return;}
 try{
  const response=await fetch('https://www.thesportsdb.com/api/v1/json/123/searchteams.php?t='+encodeURIComponent(cl));
  if(!response.ok)throw Error('Clubgegevens niet bereikbaar');
  const data=await response.json();
  const teams=(data.teams||[]).filter(t=>t.strSport==='Soccer');
  const exact=teams.find(t=>normalize(t.strTeam)===wanted)||teams[0];
  if(!exact){alert('Voor '+cl+' zijn nog geen geverifieerde clubgegevens beschikbaar.');return;}
  const team={id:Number(exact.idTeam),name:exact.strTeam,logo:exact.strBadge||'',country:exact.strCountry||'',league:exact.strLeague||''};
  if(!apiCatalog)apiCatalog={teams:[],squads:{}};
  if(!apiCatalog.teams)apiCatalog.teams=[];
  if(!apiCatalog.squads)apiCatalog.squads={};
  if(!apiCatalog.teams.some(t=>Number(t.id)===team.id))apiCatalog.teams.push(team);
  selectedLeagueEntry=null;openClub(team.id);
 }catch(err){alert('Het clubprofiel kon niet worden geladen. Controleer je verbinding en probeer opnieuw.');}
}
let directoryTab='clubs',directorySearch='',directoryPlayers=[],directoryBusy=false,directoryError='',directoryClub='';const directoryCache={};
async function lookupPlayers(team){directoryClub=team;directoryPlayers=[];directoryBusy=true;directoryError='';directoryTab='players';render();try{const match=apiCatalog?.teams?.find(t=>t.name.toLowerCase()===team.toLowerCase()||(team.toLowerCase()==='psv'&&t.name.toLowerCase()==='psv eindhoven'));const squad=match&&apiCatalog?.squads?.[match.id];if(squad?.length){directoryPlayers=squad.map(p=>({idPlayer:String(p.id),strPlayer:p.name,strThumb:p.photo,strPosition:p.position,strNumber:p.number,strTeam:team,strSport:'Soccer',strNationality:'',dateBorn:'',strHeight:''}));}else{const response=await fetch('https://www.thesportsdb.com/api/v1/json/123/searchplayers.php?t='+encodeURIComponent(team));if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();directoryPlayers=(data.player||[]).filter(p=>p.strSport==='Soccer');if(!directoryPlayers.length)directoryError='Nog geen spelers beschikbaar voor '+team+'. De selectie wordt via API-Football bijgewerkt.'}}catch(e){directoryError='Selectie is nog niet geladen. API-Football verwerkt de gegevens automatisch; probeer het later opnieuw.'}directoryBusy=false;render()}
function clubRank(t){const n=(t.name||'').toLowerCase(),l=(t.league||'').toLowerCase();const famous=['real madrid','barcelona','manchester city','liverpool','arsenal','manchester united','chelsea','bayern munich','paris saint germain','inter','ac milan','juventus','ajax','psv eindhoven','feyenoord','az alkmaar','fc twente','fc utrecht'];const i=famous.indexOf(n);if(i>=0)return i;return 100+(l.includes('premier league')?0:l.includes('primera división')||l.includes('la liga')?5:l.includes('bundesliga')?10:l.includes('serie a')?15:l.includes('ligue 1')?20:l.includes('eredivisie')?25:80)}
function clubMatches(q){const words=q.trim().toLocaleLowerCase('nl').split(/\s+/).filter(Boolean);return (apiCatalog?.teams||[]).filter(t=>words.every(w=>(t.name+' '+t.country+' '+(t.league||'')).toLocaleLowerCase('nl').includes(w))).sort((a,b)=>clubRank(a)-clubRank(b)||a.name.localeCompare(b.name,'nl'))}
function openClub(id){selectedTeamId=Number(id);directoryTab='clubs';page='clubProfile';render()}
function clubProfile(){const t=(apiCatalog?.teams||[]).find(x=>Number(x.id)===Number(selectedTeamId));if(!t)return '<button class="back" onclick="nav(\'leagues\')">‹ Terug</button><div class="panel empty">Club niet gevonden.</div>';const squad=apiCatalog?.squads?.[t.id]||[];return '<button class="back" onclick="nav(selectedLeagueEntry?\'leagueInfo\':\'clubDirectory\')">‹ Terug</button><div class="panel cardpad" style="text-align:center">'+(t.logo?'<img src="'+esc(t.logo)+'" alt="" style="width:90px;height:90px;object-fit:contain">':'')+'<h1 class="heading">'+esc(t.name)+'</h1><div class="sub">'+esc(t.country||'')+' · '+esc(t.league||'')+'</div></div><h2 class="heading">Selectie ('+squad.length+')</h2><div class="panel">'+(squad.length?squad.map(x=>'<div class="stat"><span style="display:flex;align-items:center;gap:10px">'+(x.photo?'<img src="'+esc(x.photo)+'" alt="" loading="lazy" style="width:42px;height:42px;object-fit:cover;border-radius:50%">':'')+esc(x.name)+'</span><span class="sub">'+esc(x.position||'')+'</span></div>').join(''):'<div class="empty">Voor deze club zijn nog geen geverifieerde spelersgegevens geladen.</div>')+'</div>'}

function directoryQuery(q){directorySearch=q;const el=document.getElementById('clubResults');if(el)el.innerHTML=clubRows(clubMatches(q))}

function formRadar(){const fixtures=(apiHistory?.fixtures||[]).filter(g=>['FT','AET','PEN'].includes(g.status)&&g.h!=null&&g.a!=null);const teams=[...new Set(fixtures.flatMap(g=>[g.home,g.away]))].sort((a,b)=>a.localeCompare(b));if(!formTeam&&teams.length)formTeam=teams[0];const recent=fixtures.filter(g=>g.home===formTeam||g.away===formTeam).sort((a,b)=>b.time.localeCompare(a.time)).slice(0,5);const scored=recent.reduce((n,g)=>n+(g.home===formTeam?g.h:g.a),0),conceded=recent.reduce((n,g)=>n+(g.home===formTeam?g.a:g.h),0);const outcomes=recent.map(g=>{const gf=g.home===formTeam?g.h:g.a,ga=g.home===formTeam?g.a:g.h;return gf>ga?'W':gf<ga?'V':'G'});return '<h1 class="heading">⚡ Vormradar</h1><div class="notice">Ontdek de vorm van je club op basis van echte, afgeronde wedstrijden uit het Kickza-archief. Geen voorspelling.</div>'+(teams.length?'<div class="panel cardpad"><label>Jouw club</label><select class="field" onchange="formTeam=this.value;render()">'+teams.map(t=>'<option value="'+esc(t)+'" '+(t===formTeam?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select><h2 style="margin-top:20px">'+esc(formTeam)+'</h2><div class="row" style="justify-content:center;gap:10px;margin:22px 0">'+outcomes.map(x=>'<span style="display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:'+(x==='W'?'#caff00':x==='G'?'#ddd':'#222')+';color:'+(x==='V'?'white':'black')+';font-weight:900">'+x+'</span>').join('')+'</div><div class="row"><div><b>'+recent.length+'</b><div class="sub">Wedstrijden</div></div><div><b>'+scored+'</b><div class="sub">Goals voor</div></div><div><b>'+conceded+'</b><div class="sub">Goals tegen</div></div></div><div class="section">Laatste resultaten</div>'+recent.map(g=>'<div class="stat"><span>'+esc(g.home)+' – '+esc(g.away)+'</span><b>'+g.h+' - '+g.a+'</b></div>').join('')+'</div>':'<div class="panel empty">De Vormradar wordt zichtbaar zodra historische wedstrijdresultaten zijn opgehaald.</div>')}

function tttAnswer(id){if(tttPick<0||tttWinner)return;const i=tttPick,valid=tttMatches(i).find(p=>p.id===id),old=tttBoard[i];if(valid&&(!old||old.id!==id)){if(old)tttSteals[tttTurn]--;tttBoard[i]={owner:tttTurn,id,name:valid.name,photo:valid.photo};if(tttLines.some(line=>line.every(n=>tttBoard[n]?.owner===tttTurn)))tttWinner=tttTurn+' wint!';else if(tttBoard.every(Boolean))tttWinner=tttMode==='solo'?'Alle vakjes gevuld!':'Gelijkspel!';else if(tttMode==='duel')tttTurn=tttTurn==='X'?'O':'X';tttMessage='Correct: '+valid.name}else{tttWrong++;tttMessage=old?.id===id?'Kies een andere speler om dit vak te stelen.':'Niet goed: deze speler voldoet niet aan beide clubs.';if(tttMode==='duel')tttTurn=tttTurn==='X'?'O':'X';if(tttMode==='solo'&&tttDifficulty==='moeilijk'&&tttWrong>=3)tttWinner='Game over: drie fouten.'}tttPick=-1;tttSearch='';render()}

function kzTopPool(){return passportPool().filter(p=>p.age!=null&&Number(p.age)>0&&p.name).sort((a,b)=>Number(a.age)-Number(b.age)||a.name.localeCompare(b.name)).filter((p,i,a)=>a.findIndex(x=>x.name===p.name)===i).slice(0,10)}
function kzTopQuery(q){kzTopSearch=q;const el=document.getElementById('kzTopSuggestions');if(el)el.innerHTML=kzTopSuggestions()}
function kzTopSuggestions(){const q=kzTopSearch.trim().toLocaleLowerCase('nl');if(q.length<2)return '<div class="sub">Typ minstens twee letters.</div>';return passportPool().filter((p,i,a)=>p.name.toLocaleLowerCase('nl').includes(q)&&a.findIndex(x=>x.name===p.name)===i).slice(0,8).map(p=>'<button class="install" style="display:block;width:100%;text-align:left;margin:5px 0" onclick="kzTopGuess('+JSON.stringify(p.name).replace(/"/g,'&quot;')+')">'+esc(p.name)+'</button>').join('')||'<div class="sub">Geen speler gevonden.</div>'}
function kzTopGuess(name){const p=kzTopPool().find(x=>x.name===name);if(p&&!kzTopEntries.includes(name))kzTopEntries.push(name);kzTopSearch='';render()}
function kzTopScreen(){const pool=kzTopPool();return '<button class="back" onclick="kzBack()">‹ Hoofdstukken</button><h1 class="heading">Top 10</h1><div class="notice">Vind de 10 jongste spelers uit de huidige Kickza-selectiedatabase. Rangschikking op de geregistreerde leeftijd; dit is geen wereldwijde top 10.</div><div class="panel cardpad"><div class="row"><b>Jongste spelers</b><b>'+kzTopEntries.length+'/10</b></div><input id="kzTopSearchInput" class="search" autocomplete="off" placeholder="Zoek een speler…" value="'+esc(kzTopSearch)+'" oninput="kzTopQuery(this.value)"><div id="kzTopSuggestions">'+kzTopSuggestions()+'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px">'+pool.map((p,i)=>'<div style="border:1px solid #46524c;border-radius:10px;padding:13px;min-height:55px;background:'+(kzTopEntries.includes(p.name)?'#2b553a':'#202627')+'"><b style="color:#caff00">'+(i+1)+'</b> '+(kzTopEntries.includes(p.name)?esc(p.name):'???')+'</div>').join('')+'</div>'+(kzTopEntries.length===10?'<div class="notice">Alle tien gevonden!</div>':'')+'<button class="install" style="margin-top:14px" onclick="kzStartTop10()">Opnieuw spelen</button></div>'}
function miniGames(){return '<h1 class="heading">Kickza Games</h1><div class="panel"><div class="stat" onclick="kzGameMode=\'chapters\';nav(\'passport\')" style="cursor:pointer"><span>▤ Voetbalpaspoort<div class="sub">Hoofdstukken, levels en opgeslagen voortgang</div></span><b>›</b></div><div class="stat" onclick="nav(\'ttt\')" style="cursor:pointer"><span>▦ Tiki-Taka-Toe<div class="sub">Clubcombinaties · 3 op een rij</div></span><b>›</b></div><div class="stat" onclick="kzStartTop10();nav(\'passport\')" style="cursor:pointer"><span>≡ Top 10<div class="sub">Zoek de tien jongste spelers uit de database</div></span><b>›</b></div></div>'}
function render(){const focus=['tttSearchInput','kzTopSearchInput','kzCareerSearchInput'].includes(document.activeElement?.id);const focusId=focus?document.activeElement.id:null;const caret=focus?document.activeElement.selectionStart:null;document.getElementById("app").innerHTML='<header class="top"><div class="brand">'+logo+'</div><small>BÈTA • v1.1</small></header><main class="pad">'+(page==="home"||page==="matches"?gamesView():page==="detail"?detail():page==="leagues"?leagueView():page==="leagueInfo"?leagueInfo():page==="clubDirectory"?directoryView():page==="clubProfile"?clubProfile():page==="league"?leagueDetail():page==="favorites"?'<h1 class="heading">Favorieten</h1><div class="panel">'+(games.filter(g=>fav.includes(g.id)).map(gameRow).join("")||'<div class="empty">Tik op ☆ bij een wedstrijd om hem te bewaren.</div>')+'</div>':page==="games"?miniGames():page==="ttt"?ticTacToe():page==="passport"?passportGame():page==="form"?formRadar():page==="battle"?battle():page==="predictions"?predictions():'<h1 class="heading">Meer</h1><div class="panel"><div class="stat" onclick="nav(\'form\')">⚡ Vormradar <span>›</span></div><div class="stat" onclick="nav(\'games\')">◇ Voetbalspelletjes <span>›</span></div><div class="stat" onclick="nav(\'battle\')">⚔️ Player Battle <span>›</span></div><div class="stat" onclick="nav(\'predictions\')">🏆 Voorspellingen <span>›</span></div><div class="stat" onclick="nav(\'leagues\')">📊 Competities <span>›</span></div></div><div class="notice">Kickza is een demo. Echte data, pushmeldingen en accounts zijn nog niet beschikbaar.</div>')+'</main><nav class="bottom">'+tabs.map(([p,ic,label])=>'<button class="'+(page===p?"active":"")+'" onclick="nav(\''+p+'\')"><span class="nav-icon">'+(navIcons[ic]||ic)+'</span>'+label+'</button>').join("")+'</nav>';if(focus){const input=document.getElementById(focusId);if(input){input.focus();if(caret!==null)input.setSelectionRange(caret,caret)}}}
try{render();loadApiSnapshot()}catch(e){document.getElementById("app").innerHTML="<header class=\"top\"><div class=\"brand\">Kickza</div></header><main class=\"pad\"><h1>Er ging iets mis bij het laden</h1><p>"+String(e.message)+"</p></main>"};if("serviceWorker"in navigator)navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{});
</script></body></html>

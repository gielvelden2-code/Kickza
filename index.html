let catalogQuery='',catalogCountry='Alles';

function clubCatalog(){const q=catalogQuery.toLocaleLowerCase('nl');let items=catalog.filter(c=>catalogCountry==='Alles'||catalogCountry===c.country).flatMap(c=>c.leagues.map(l=>({...l,country:c.country,flag:c.flag}))).filter(l=>(l.name+' '+l.country+' '+l.clubs.join(' ')).toLocaleLowerCase('nl').includes(q));return '<h1 class="heading">Competities & clubs</h1><div class="notice">Clubcatalogus ter oriëntatie. Deelnemers per seizoen worden na API-koppeling bijgewerkt.</div><input class="search" id="catalogSearch" placeholder="Zoek competitie, land of club" value="'+esc(catalogQuery)+'" oninput="catalogQuery=this.value;updateCatalog()"><div class="filters" style="margin-top:12px">'+['Alles',...catalog.map(c=>c.country)].map(c=>'<button class="'+(catalogCountry===c?'active':'')+'" onclick="catalogCountry='+JSON.stringify(c).replace(/"/g,'&quot;')+';render()">'+(c==='Alles'?'🌍 Alles':catalog.find(x=>x.country===c).flag+' '+esc(c))+'</button>').join('')+'</div><div id="catalogResults">'+catalogResults(items)+'</div>'}

function nav(p){page=p;render()}function match(id){selected=id;page="detail";render()}function toggle(id){let i=fav.indexOf(id);i<0?fav.push(id):fav.splice(i,1);save();render()}function setFilter(f){filter=f;render()}function setDate(d){date=d;render()}
function gameRow(g){return '<div class="match"><div class="time '+(g.status==="live"?"live":"")+'">'+(g.status==="live"?"● "+g.minute+"′":g.status==="done"?"AFG":g.time||"—")+'</div><div class="teams" onclick="match('+g.id+')"><div class="team"><span class="crest">'+esc(g.home[0])+'</span>'+esc(g.home)+'</div><div class="team"><span class="crest">'+esc(g.away[0])+'</span>'+esc(g.away)+'</div></div><div class="score" onclick="match('+g.id+')">'+(g.h===undefined?"–":g.h+" - "+g.a)+'</div><button class="star '+(fav.includes(g.id)?"on":"")+'" onclick="toggle('+g.id+')" aria-label="Favoriet">'+(fav.includes(g.id)?"★":"☆")+'</button></div>'}
function gamesView(){if(apiSnapshot?.fixtures?.length&&date===0)return '<h1 class="heading">Wedstrijden</h1><div class="filters">'+['Alles','Live','Komend','Afgelopen'].map(f=>'<button class="'+(filter===f?'active':'')+'" data-filter="'+f+'" onclick="setFilter(this.dataset.filter)">'+f+'</button>').join('')+'</div>'+realGames();let gs=games.filter(g=>g.date===date&&(filter==="Alles"||filter==="Favorieten"&&fav.includes(g.id)||filter==="Live"&&g.status==="live"||filter==="Komend"&&g.status==="soon"||filter==="Afgelopen"&&g.status==="done"));let groups=[...new Set(gs.map(g=>g.league))];return '<div class="dates">'+[-2,-1,0,1,2].map(d=>'<button class="'+(date===d?"active":"")+'" onclick="setDate('+d+')">'+(d===0?"Vandaag":d===-1?"Gisteren":d===1?"Morgen":d<0?"-2 dagen":"+2 dagen")+'</button>').join("")+'</div><h1 class="heading">'+(page==="home"?"Vandaag":"Wedstrijden")+'</h1><div class="filters">'+["Alles","Live","Komend","Afgelopen","Favorieten"].map(f=>'<button class="'+(filter===f?"active":"")+'" onclick="setFilter(\''+f+'\')">'+f+'</button>').join("")+'</div><div class="notice">DEMO: uitslagen, minuten en gebeurtenissen zijn fictief en niet live.</div>'+(groups.length?groups.map(l=>'<div class="section">'+countryFlag(l)+' '+esc(l)+' <span onclick="openLeague(\''+l+'\')">›</span></div><div class="panel">'+gs.filter(g=>g.league===l).map(gameRow).join("")+'</div>').join(""):'<div class="panel empty">Geen wedstrijden voor deze selectie</div>')}
function openLeague(l){league=l;tab="Stand";page="league";render()}function standings(){return '<div class="panel"><div class="stat muted"><span># &nbsp; Team</span><span>G &nbsp; P &nbsp; DV &nbsp; DT</span></div>'+table.map((t,i)=>'<div class="stat"><span><b style="background:'+(i<2?"#caff00":"#eef0f2")+';border-radius:7px;padding:5px 9px">'+(i+1)+'</b> &nbsp; '+esc(t[0])+'</span><span>'+t[1]+' &nbsp; <b>'+t[2]+'</b> &nbsp; '+t[3]+' &nbsp; '+t[4]+'</span></div>').join("")+'</div>'}
function leagueView(){return directoryView()}
function detail(){let g=games.find(x=>x.id===selected);return '<button class="back" onclick="nav(\'matches\')">‹ Terug</button><div class="center muted">'+esc(g.league)+'</div><div class="panel hero center"><div class="row"><b>'+esc(g.home)+'</b><div class="heroScore">'+(g.h===undefined?"– : –":g.h+" - "+g.a)+'</div><b>'+esc(g.away)+'</b></div><div class="'+(g.status==="live"?"live":"muted")+'">'+(g.status==="live"?"● Live "+g.minute+"′":g.status==="done"?"Afgelopen":"Nog niet begonnen")+'</div></div><div class="tabs">'+["Verslag","Statistieken","Opstelling"].map(t=>'<button class="'+(tab===t?"active":"")+'" onclick="setTab(\''+t+'\')">'+t+'</button>').join("")+'</div>'+(tab==="Statistieken"?'<div class="panel cardpad"><b>Match Pulse — demo</b><div class="pulse"></div><div class="row"><b>56%</b><b>44%</b></div><p class="muted">Illustratieve spanningsmeter. Voor echte statistieken is een API nodig.</p></div>':tab==="Opstelling"?'<div class="panel empty">Opstellingen beschikbaar na aansluiting van de voetbal-API.</div>':'<div class="panel">'+(g.events||[]).map(e=>'<div class="stat"><b>'+e[0]+'</b><span>'+e[1]+'</span></div>').join("")+'<div class="cardpad muted">Live tekstcommentaar en bevestigde doelpuntenmakers volgen na API-koppeling.</div></div>')}
function setTab(t){tab=t;render()}function leagueDetail(){return '<button class="back" onclick="nav(\'leagues\')">‹ Competities</button><h1 class="heading">'+esc(league)+'</h1><div class="tabs">'+["Stand","Wedstrijden","Topscorers"].map(t=>'<button class="'+(tab===t?"active":"")+'" onclick="setTab(\''+t+'\')">'+t+'</button>').join("")+'</div>'+(tab==="Stand"?standings():tab==="Wedstrijden"?'<div class="panel">'+games.filter(g=>g.league===league).map(gameRow).join("")+'</div>':'<div class="panel">'+players.map((p,i)=>'<div class="stat">'+(i+1)+'. '+p.name+' <b>'+p.goals+' goals</b></div>').join("")+'</div>')+'<div class="notice">Alle standen en statistieken zijn demo.</div>'}
function battle(){let a=players[p1],b=players[p2];return '<h1 class="heading">Player Battle</h1><div class="panel cardpad"><div class="row"><select onchange="p1=+this.value;render()">'+players.map((p,i)=>'<option value="'+i+'" '+(p1===i?"selected":"")+'>'+p.name+'</option>').join("")+'</select><span class="vs">VS</span><select onchange="p2=+this.value;render()">'+players.map((p,i)=>'<option value="'+i+'" '+(p2===i?"selected":"")+'>'+p.name+'</option>').join("")+'</select></div>'+[["Wedstrijden","matches"],["Doelpunten","goals"],["Assists","assists"]].map(([label,k])=>'<div style="margin-top:24px" class="center"><b>'+label+'</b><div class="row"><b>'+a[k]+'</b><b>'+b[k]+'</b></div><div class="bar"><i style="width:'+Math.round(a[k]/Math.max(1,a[k]+b[k])*100)+'%"></i></div></div>').join("")+'</div><div class="notice">Spelerstatistieken zijn fictieve testwaarden.</div>'}
function predictions(){return '<h1 class="heading">Voorspellingen</h1><div class="notice">Demo: voorspellingen worden lokaal bewaard. Er worden nog geen echte punten toegekend.</div>'+games.filter(g=>g.status==="soon").map(g=>{let v=pred[g.id]||{};return '<div class="section">'+esc(g.home)+' – '+esc(g.away)+'</div><div class="panel cardpad"><div class="row"><b>'+esc(g.home)+'</b><span>tegen</span><b>'+esc(g.away)+'</b></div><div class="row" style="justify-content:center;margin:15px"><input class="field" type="number" min="0" max="30" id="h'+g.id+'" value="'+(v.h??"")+'" placeholder="0"> — <input class="field" type="number" min="0" max="30" id="a'+g.id+'" value="'+(v.a??"")+'" placeholder="0"></div><button class="primary" onclick="savePred('+g.id+')">Voorspelling opslaan</button></div>'}).join("")+'<div class="section">Seizoensvoorspellingen</div><div class="panel cardpad"><label>Topscorer</label><input id="top" style="width:100%;padding:12px;margin:8px 0 16px" value="'+esc(pred.top||"")+'" placeholder="Naam speler"><label>Meeste assists</label><input id="assist" style="width:100%;padding:12px;margin:8px 0 16px" value="'+esc(pred.assist||"")+'" placeholder="Naam speler"><button class="primary" onclick="saveSeason()">Opslaan</button></div>'}
function savePred(id){let h=document.getElementById("h"+id).value,a=document.getElementById("a"+id).value;if(h===""||a===""){alert("Vul beide scores in");return}pred[id]={h:+h,a:+a};save();alert("Voorspelling opgeslagen")}function saveSeason(){pred.top=document.getElementById("top").value;pred.assist=document.getElementById("assist").value;save();alert("Seizoensvoorspellingen opgeslagen")}
function render(){document.getElementById("app").innerHTML='<header class="top"><div class="brand">'+logo+'</div><small>DEMO • v1.0</small></header><main class="pad">'+(page==="home"||page==="matches"?gamesView():page==="detail"?detail():page==="leagues"?leagueView():page==="league"?leagueDetail():page==="favorites"?'<h1 class="heading">Favorieten</h1><div class="panel">'+(games.filter(g=>fav.includes(g.id)).map(gameRow).join("")||'<div class="empty">Tik op ☆ bij een wedstrijd om hem te bewaren.</div>')+'</div>':page==="battle"?battle():page==="predictions"?predictions():'<h1 class="heading">Meer</h1><div class="panel"><div class="stat" onclick="nav(\'battle\')">⚔️ Player Battle <span>›</span></div><div class="stat" onclick="nav(\'predictions\')">🏆 Voorspellingen <span>›</span></div><div class="stat" onclick="nav(\'leagues\')">📊 Competities <span>›</span></div></div><div class="notice">Kickza is een demo. Echte data, pushmeldingen en accounts zijn nog niet beschikbaar.</div>')+'</main><nav class="bottom">'+tabs.map(([p,ic,label])=>'<button class="'+(page===p?"active":"")+'" onclick="nav(\''+p+'\')"><span>'+ic+'</span>'+label+'</button>').join("")+'</nav>'}
try{render();loadApiSnapshot()}catch(e){document.getElementById("app").innerHTML="<header class=\"top\"><div class=\"brand\">Kickza</div></header><main class=\"pad\"><h1>Er ging iets mis bij het laden</h1><p>"+String(e.message)+"</p></main>"};if("serviceWorker"in navigator)navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{});
</script></body></html>
